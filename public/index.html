<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Chart - Advanced Indicators</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
      background: #0d1117; 
      color: #c9d1d9; 
      padding: 20px; 
      min-height: 100vh;
    }
    
    .container { max-width: 1600px; margin: 0 auto; }
    
    h1 { 
      margin: 0 0 20px 0; 
      font-size: 28px; 
      font-weight: 600; 
      color: #58a6ff; 
    }
    
    .controls { 
      display: flex; 
      gap: 15px; 
      margin-bottom: 20px; 
      flex-wrap: wrap;
      align-items: center;
      background: #161b22;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    
    .control-group {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 5px 10px;
      background: #0d1117;
      border-radius: 6px;
    }
    
    .control-label {
      font-size: 13px;
      color: #8b949e;
      font-weight: 500;
    }
    
    input, button, select { 
      padding: 8px 12px; 
      font-size: 14px; 
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #c9d1d9;
    }
    
    input[type="number"] {
      width: 70px;
    }
    
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    select {
      cursor: pointer;
    }
    
    input:focus, select:focus { outline: none; border-color: #58a6ff; }
    
    button { 
      background: #238636; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: 500;
      transition: background 0.2s;
    }
    
    button:hover { background: #2ea043; }
    button:disabled { 
      background: #21262d; 
      color: #484f58; 
      cursor: not-allowed; 
    }
    
    .charts-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    
    .chart-wrapper {
      position: relative;
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
    }
    
    #price-chart-wrapper { height: 500px; }
    #zscore-chart-wrapper { height: 250px; }
    #rsi-chart-wrapper { height: 200px; }
    
    .chart-label {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 16px;
      z-index: 100;
      pointer-events: none;
      user-select: none;
      background: rgba(13, 17, 23, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      line-height: 1.4;
    }
    
    .chart-label strong {
      font-size: 20px;
      display: block;
      margin-bottom: 2px;
    }
    
    .chart-label-name {
      font-size: 13px;
      color: #8b949e;
      display: block;
    }
    
    .price-change {
      font-weight: 600;
      margin-top: 4px;
      display: inline-block;
    }
    
    .indicator-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 13px;
      z-index: 100;
      pointer-events: none;
      user-select: none;
      background: rgba(13, 17, 23, 0.85);
      padding: 6px 10px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      border: 1px solid #30363d;
      font-weight: 600;
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-header {
      margin: 0 0 16px 0;
      font-size: 20px;
      font-weight: 600;
    }
    
    .symbol-item {
      padding: 12px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .symbol-item:hover {
      background: #1c2128;
      border-color: #58a6ff;
    }
    
    .symbol-item-symbol {
      font-weight: 600;
      color: #58a6ff;
      font-size: 16px;
    }
    
    .symbol-item-name {
      color: #8b949e;
      font-size: 14px;
      margin-top: 4px;
    }
    
    .modal-close {
      margin-top: 16px;
      width: 100%;
      background: #21262d;
      color: #c9d1d9;
    }
    
    #status {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
    }
    
    #status.info { background: #1f6feb; color: white; }
    #status.error { background: #da3633; color: white; }
    #status.success { background: #238636; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📈 Advanced Stock Chart Analysis</h1>
    
    <div id="status"></div>
    
    <div class="controls">
      <div class="control-group">
        <input 
          id="symbol" 
          placeholder="Ticker or company" 
          value="AAPL"
          style="width: 200px;"
        />
        <button id="loadBtn">Load Chart</button>
      </div>
      
      <div class="control-group">
        <span class="control-label">Interval:</span>
        <select id="interval">
          <option value="1min">1 Min</option>
          <option value="5min">5 Min</option>
          <option value="15min">15 Min</option>
          <option value="30min">30 Min</option>
          <option value="45min">45 Min</option>
          <option value="1h">1 Hour</option>
          <option value="2h">2 Hours</option>
          <option value="4h">4 Hours</option>
          <option value="1day" selected>1 Day</option>
          <option value="1week">1 Week</option>
          <option value="1month">1 Month</option>
        </select>
      </div>
      
      <div class="control-group">
        <input type="checkbox" id="smaToggle">
        <span class="control-label">SMA</span>
        <input 
          id="smaPeriod" 
          type="number" 
          min="2" 
          max="200" 
          value="20"
          disabled
        />
      </div>
      
      <div class="control-group">
        <span class="control-label">MR Lookback:</span>
        <input 
          id="lookback" 
          type="number" 
          min="5" 
          max="200" 
          value="20"
        />
        <button id="updateIndicators">Update</button>
      </div>
    </div>

    <div class="charts-container">
      <div id="price-chart-wrapper" class="chart-wrapper"></div>
      <div id="zscore-chart-wrapper" class="chart-wrapper"></div>
      <div id="rsi-chart-wrapper" class="chart-wrapper"></div>
    </div>
  </div>

  <script>
    // ============================================
    // STATE MANAGEMENT
    // ============================================
    const state = {
      charts: {
        price: null,
        zscore: null,
        rsi: null
      },
      series: {
        price: null,
        sma: null,
        zscore: null,
        rsi: null
      },
      currentSymbol: null,
      currentName: null,
      currentData: null,
      currentInterval: '1day',
      lookbackPeriod: 20,
      smaPeriod: 20,
      smaEnabled: false
    };

    const els = {
      symbol: document.getElementById('symbol'),
      interval: document.getElementById('interval'),
      loadBtn: document.getElementById('loadBtn'),
      smaToggle: document.getElementById('smaToggle'),
      smaPeriod: document.getElementById('smaPeriod'),
      lookback: document.getElementById('lookback'),
      updateIndicators: document.getElementById('updateIndicators'),
      status: document.getElementById('status')
    };

    // ============================================
    // CHART INITIALIZATION WITH SYNCHRONIZED CROSSHAIR
    // ============================================
    function initCharts() {
      const priceWrapper = document.getElementById('price-chart-wrapper');
      const zscoreWrapper = document.getElementById('zscore-chart-wrapper');
      const rsiWrapper = document.getElementById('rsi-chart-wrapper');

      // Common chart options
      const commonOptions = {
        layout: { background: { color: '#0d1117' }, textColor: '#c9d1d9' },
        grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
        crosshair: { 
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { 
            color: '#58a6ff', 
            style: LightweightCharts.LineStyle.Solid,
            width: 1,
            labelBackgroundColor: '#58a6ff'
          },
          horzLine: { 
            color: '#58a6ff', 
            style: LightweightCharts.LineStyle.Solid,
            width: 1,
            labelBackgroundColor: '#58a6ff'
          }
        },
        rightPriceScale: { borderColor: '#30363d' }
      };

      // Price chart
      state.charts.price = LightweightCharts.createChart(priceWrapper, {
        ...commonOptions,
        width: priceWrapper.clientWidth,
        height: priceWrapper.clientHeight,
        timeScale: { borderColor: '#30363d', visible: false }
      });

      state.series.price = state.charts.price.addLineSeries({
        color: '#58a6ff',
        lineWidth: 2,
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
      });

      state.series.sma = state.charts.price.addLineSeries({
        color: '#f1c40f',
        lineWidth: 2,
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
        visible: false
      });

      // Z-Score chart
      state.charts.zscore = LightweightCharts.createChart(zscoreWrapper, {
        ...commonOptions,
        width: zscoreWrapper.clientWidth,
        height: zscoreWrapper.clientHeight,
        timeScale: { borderColor: '#30363d', visible: false }
      });

      state.series.zscore = state.charts.zscore.addLineSeries({
        color: '#a371f7',
        lineWidth: 2,
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
      });

      // Add z-score reference lines
      const zLevels = [2.5, 2.0, 1.5, 0.5, -0.5, -1.5, -2.0, -2.5];
      zLevels.forEach(level => {
        state.charts.zscore.addLineSeries({
          color: 'rgba(88, 166, 255, 0.35)',
          lineWidth: 1,
          priceLineVisible: false,
          lastValueVisible: false
        }).setData([
          { time: '2020-01-01', value: level },
          { time: '2030-12-31', value: level }
        ]);
      });

      // RSI chart
      state.charts.rsi = LightweightCharts.createChart(rsiWrapper, {
        ...commonOptions,
        width: rsiWrapper.clientWidth,
        height: rsiWrapper.clientHeight,
        timeScale: { borderColor: '#30363d' }
      });

      state.series.rsi = state.charts.rsi.addLineSeries({
        color: '#26a69a',
        lineWidth: 2,
        priceFormat: { type: 'price', precision: 2, minMove: 0.01 }
      });

      // Add RSI reference lines at 30 and 70
      [30, 70].forEach(level => {
        state.charts.rsi.addLineSeries({
          color: 'rgba(88, 166, 255, 0.35)',
          lineWidth: 1,
          priceLineVisible: false,
          lastValueVisible: false
        }).setData([
          { time: '2020-01-01', value: level },
          { time: '2030-12-31', value: level }
        ]);
      });

      // SYNCHRONIZED CROSSHAIR & TIME SCALES
      syncCharts();

      // Handle window resize
      window.addEventListener('resize', resizeCharts);
    }

    function syncCharts() {
      // Sync time scales
      const charts = [state.charts.price, state.charts.zscore, state.charts.rsi];
      
      charts.forEach((chart, index) => {
        chart.timeScale().subscribeVisibleTimeRangeChange(() => {
          const range = chart.timeScale().getVisibleRange();
          if (range) {
            charts.forEach((otherChart, otherIndex) => {
              if (index !== otherIndex) {
                otherChart.timeScale().setVisibleRange(range);
              }
            });
          }
        });
      });

      // Sync crosshair movement
      // Map chart indices to their primary series
      const seriesMap = [state.series.price, state.series.zscore, state.series.rsi];
      
      charts.forEach((chart, index) => {
        chart.subscribeCrosshairMove((param) => {
          if (param.time) {
            charts.forEach((otherChart, otherIndex) => {
              if (index !== otherIndex && seriesMap[otherIndex]) {
                otherChart.setCrosshairPosition(param.logical, param.time, seriesMap[otherIndex]);
              }
            });
          }
        });
      });
    }

    function resizeCharts() {
      Object.keys(state.charts).forEach(key => {
        if (state.charts[key]) {
          const wrapper = document.getElementById(`${key}-chart-wrapper`);
          state.charts[key].applyOptions({
            width: wrapper.clientWidth,
            height: wrapper.clientHeight
          });
        }
      });
    }

    // ============================================
    // TECHNICAL INDICATORS
    // ============================================
    
    /**
     * Calculate Simple Moving Average
     * SMA = average of last N prices
     */
    function calculateSMA(priceData, period) {
      const sma = [];
      
      for (let i = period - 1; i < priceData.length; i++) {
        const window = priceData.slice(i - period + 1, i + 1);
        const sum = window.reduce((acc, d) => acc + d.value, 0);
        const avg = sum / period;
        
        sma.push({
          time: priceData[i].time,
          value: avg
        });
      }
      
      return sma;
    }

    /**
     * Calculate Z-Scores (rolling z-score calculation)
     */
    function calculateZScores(priceData, lookback) {
      const zscores = [];
      
      for (let i = lookback - 1; i < priceData.length; i++) {
        const window = priceData.slice(i - lookback + 1, i + 1);
        const prices = window.map(d => d.value);
        
        const mean = prices.reduce((sum, p) => sum + p, 0) / prices.length;
        const squaredDiffs = prices.map(p => Math.pow(p - mean, 2));
        const variance = squaredDiffs.reduce((sum, d) => sum + d, 0) / prices.length;
        const stdDev = Math.sqrt(variance);
        
        const currentPrice = priceData[i].value;
        const zscore = stdDev === 0 ? 0 : (currentPrice - mean) / stdDev;
        
        zscores.push({
          time: priceData[i].time,
          value: zscore
        });
      }
      
      return zscores;
    }

    /**
     * Calculate RSI (Relative Strength Index)
     * Standard period is 14
     */
    function calculateRSI(priceData, period = 14) {
      const rsi = [];
      const changes = [];
      
      // Calculate price changes
      for (let i = 1; i < priceData.length; i++) {
        changes.push(priceData[i].value - priceData[i - 1].value);
      }
      
      // Need at least 'period' changes to start
      for (let i = period; i < changes.length; i++) {
        const window = changes.slice(i - period, i);
        
        const gains = window.filter(c => c > 0);
        const losses = window.filter(c => c < 0).map(c => Math.abs(c));
        
        const avgGain = gains.length > 0 ? gains.reduce((a, b) => a + b, 0) / period : 0;
        const avgLoss = losses.length > 0 ? losses.reduce((a, b) => a + b, 0) / period : 0;
        
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        const rsiValue = 100 - (100 / (1 + rs));
        
        rsi.push({
          time: priceData[i + 1].time,
          value: rsiValue
        });
      }
      
      return rsi;
    }

    // ============================================
    // UI HELPERS
    // ============================================
    function showStatus(message, type = 'info') {
      els.status.textContent = message;
      els.status.className = type;
      els.status.style.display = 'block';
      
      setTimeout(() => {
        els.status.style.display = 'none';
      }, 5000);
    }

    function updatePriceLabel(symbol, name, data) {
      const oldLabel = document.getElementById('price-label');
      if (oldLabel) oldLabel.remove();

      if (!data || data.length === 0) return;

      const lastBar = data[data.length - 1];
      const firstBar = data[0];
      const lastPrice = lastBar.value.toFixed(2);
      const change = ((lastBar.value - firstBar.value) / firstBar.value * 100).toFixed(2);
      const isPositive = change >= 0;
      const changeText = `${isPositive ? '+' : ''}${change}%`;

      const label = document.createElement('div');
      label.id = 'price-label';
      label.className = 'chart-label';
      label.innerHTML = `
        <strong>${symbol}</strong>
        ${name ? `<span class="chart-label-name">${name}</span>` : ''}
        <span style="color: #8b949e;">$${lastPrice}</span>
        <span class="price-change" style="color: ${isPositive ? '#3fb950' : '#f85149'};">
          ${changeText}
        </span>
      `;

      document.getElementById('price-chart-wrapper').appendChild(label);
    }

    function updateIndicatorLabels() {
      // Z-Score label
      let zLabel = document.getElementById('zscore-label');
      if (!zLabel) {
        zLabel = document.createElement('div');
        zLabel.id = 'zscore-label';
        zLabel.className = 'indicator-label';
        zLabel.style.color = '#a371f7';
        document.getElementById('zscore-chart-wrapper').appendChild(zLabel);
      }
      zLabel.textContent = `MR, ${state.lookbackPeriod}`;

      // RSI label
      let rsiLabel = document.getElementById('rsi-label');
      if (!rsiLabel) {
        rsiLabel = document.createElement('div');
        rsiLabel.id = 'rsi-label';
        rsiLabel.className = 'indicator-label';
        rsiLabel.style.color = '#26a69a';
        document.getElementById('rsi-chart-wrapper').appendChild(rsiLabel);
      }
      rsiLabel.textContent = 'RSI, 14';
    }

    // ============================================
    // SYMBOL SEARCH
    // ============================================
    function showSymbolPicker(results) {
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        
        const modal = document.createElement('div');
        modal.className = 'modal-content';
        
        const header = document.createElement('h2');
        header.className = 'modal-header';
        header.textContent = `Found ${results.length} matching symbols`;
        modal.appendChild(header);
        
        results.forEach(item => {
          const div = document.createElement('div');
          div.className = 'symbol-item';
          div.innerHTML = `
            <div class="symbol-item-symbol">${item.symbol}</div>
            <div class="symbol-item-name">${item.instrument_name}</div>
          `;
          div.addEventListener('click', () => {
            document.body.removeChild(overlay);
            // Return BOTH symbol and name
            resolve({ symbol: item.symbol, name: item.instrument_name });
          });
          modal.appendChild(div);
        });
        
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'modal-close';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => {
          document.body.removeChild(overlay);
          resolve(null);
        });
        modal.appendChild(cancelBtn);
        
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            document.body.removeChild(overlay);
            resolve(null);
          }
        });
      });
    }

    async function searchSymbol(query) {
      const response = await fetch(`/api/symbol-search?query=${encodeURIComponent(query)}`);
      const data = await response.json();
      
      if (data.status === 'error' || !data.data) {
        throw new Error(data.message || 'Search failed');
      }
      
      return data.data;
    }

    /**
     * Calculate appropriate data size based on interval
     * Goal: Always show enough data for meaningful analysis
     */
    function getOutputSize(interval) {
      const sizeMap = {
        '1min': 5000,    // ~3.5 days of trading (assuming 6.5 hour market day)
        '5min': 5000,    // ~17 days
        '15min': 5000,   // ~52 days
        '30min': 3000,   // ~78 days
        '45min': 2000,   // ~78 days
        '1h': 2000,      // ~104 days
        '2h': 1500,      // ~156 days
        '4h': 1000,      // ~166 days
        '1day': 500,     // ~2 years
        '1week': 500,    // ~10 years
        '1month': 500    // ~40 years
      };
      
      return sizeMap[interval] || 500;
    }

    async function fetchStockData(symbol, interval, outputsize = null) {
      // If outputsize not specified, calculate based on interval
      const size = outputsize || getOutputSize(interval);
      
      const response = await fetch(`/api/stock/${symbol}?outputsize=${size}&interval=${interval}`);
      const data = await response.json();
      
      if (data.status === 'error' || !data.values) {
        throw new Error(data.message || 'Failed to fetch stock data');
      }
      
      return data;
    }

    // ============================================
    // RENDER CHARTS
    // ============================================
    function renderCharts(symbol, name, data) {
      // Transform price data
      const priceData = data.values
        .map(bar => ({
          time: bar.datetime.split(' ')[0],
          value: parseFloat(bar.close)
        }))
        .filter(bar => !isNaN(bar.value))
        .reverse();

      // Update price chart
      state.series.price.setData(priceData);
      
      // Calculate and update SMA if enabled
      if (state.smaEnabled) {
        const smaData = calculateSMA(priceData, state.smaPeriod);
        state.series.sma.setData(smaData);
        state.series.sma.applyOptions({ visible: true });
      } else {
        state.series.sma.applyOptions({ visible: false });
      }
      
      state.charts.price.timeScale().fitContent();
      
      // Calculate and update z-scores
      const zscoreData = calculateZScores(priceData, state.lookbackPeriod);
      state.series.zscore.setData(zscoreData);
      state.charts.zscore.timeScale().fitContent();
      
      // Calculate and update RSI
      const rsiData = calculateRSI(priceData, 14);
      state.series.rsi.setData(rsiData);
      state.charts.rsi.timeScale().fitContent();
      
      // Update labels
      updatePriceLabel(symbol, name, priceData);
      updateIndicatorLabels();
      
      // Store current data
      state.currentData = data;
      state.currentSymbol = symbol;
      state.currentName = name;
      
      showStatus(`Successfully loaded ${symbol}`, 'success');
    }

    // ============================================
    // LOAD CHART
    // ============================================
    async function loadChart() {
      const input = els.symbol.value.trim();
      
      if (!input) {
        showStatus('Please enter a symbol or company name', 'error');
        return;
      }
      
      els.loadBtn.disabled = true;
      els.loadBtn.textContent = 'Loading...';
      
      try {
        const interval = els.interval.value;
        state.currentInterval = interval;
        
        showStatus(`Loading ${input}...`, 'info');
        
        // Try direct load (no company name available)
        try {
          const data = await fetchStockData(input.toUpperCase(), interval);
          renderCharts(input.toUpperCase(), null, data);
          return;
        } catch (directError) {
          console.log('Direct load failed, trying search');
        }
        
        // Search (company name available)
        showStatus(`Searching for "${input}"...`, 'info');
        const searchResults = await searchSymbol(input);
        
        if (!searchResults || searchResults.length === 0) {
          throw new Error(`No symbols found matching "${input}"`);
        }
        
        if (searchResults.length === 1) {
          const item = searchResults[0];
          showStatus(`Found ${item.symbol}, loading...`, 'info');
          const data = await fetchStockData(item.symbol, interval);
          renderCharts(item.symbol, item.instrument_name, data);
          return;
        }
        
        // Multiple results - show picker
        showStatus('Multiple symbols found', 'info');
        const selected = await showSymbolPicker(searchResults);
        
        if (!selected) {
          showStatus('Search cancelled', 'info');
          return;
        }
        
        showStatus(`Loading ${selected.symbol}...`, 'info');
        const data = await fetchStockData(selected.symbol, interval);
        renderCharts(selected.symbol, selected.name, data);
        
      } catch (error) {
        console.error('Load error:', error);
        showStatus(error.message, 'error');
      } finally {
        els.loadBtn.disabled = false;
        els.loadBtn.textContent = 'Load Chart';
      }
    }

    // ============================================
    // UPDATE INDICATORS
    // ============================================
    async function updateIndicators() {
      if (!state.currentData || !state.currentSymbol) {
        showStatus('Please load a chart first', 'error');
        return;
      }
      
      const newLookback = parseInt(els.lookback.value);
      
      if (isNaN(newLookback) || newLookback < 5 || newLookback > 200) {
        showStatus('Lookback must be between 5 and 200', 'error');
        return;
      }
  
      els.updateIndicators.disabled = true;
      els.updateIndicators.textContent = 'Updating...';
      
      try {
        const availableData = state.currentData.values.length;
        
        if (availableData < newLookback) {
          showStatus(`Fetching more data for ${newLookback}-day lookback...`, 'info');
          const requiredData = Math.max(getOutputSize(state.currentInterval), newLookback + 100);
          const data = await fetchStockData(state.currentSymbol, state.currentInterval, requiredData);
          state.lookbackPeriod = newLookback;
          renderCharts(state.currentSymbol, state.currentName, data);
        } else {
          state.lookbackPeriod = newLookback;
          renderCharts(state.currentSymbol, state.currentName, state.currentData);
        }
        
      } catch (error) {
        console.error('Update error:', error);
        showStatus(error.message, 'error');
      } finally {
        els.updateIndicators.disabled = false;
        els.updateIndicators.textContent = 'Update';
      }
}

// ============================================
// EVENT LISTENERS
// ============================================
els.loadBtn.addEventListener('click', loadChart);
els.updateIndicators.addEventListener('click', updateIndicators);

els.interval.addEventListener('change', () => {
  if (state.currentSymbol) {
    loadChart();
  }
});

els.smaToggle.addEventListener('change', (e) => {
  state.smaEnabled = e.target.checked;
  els.smaPeriod.disabled = !e.target.checked;
  
  if (state.currentData) {
    renderCharts(state.currentSymbol, state.currentName, state.currentData);
  }
});

els.smaPeriod.addEventListener('change', (e) => {
  const period = parseInt(e.target.value);
  if (period >= 2 && period <= 200) {
    state.smaPeriod = period;
    if (state.smaEnabled && state.currentData) {
      renderCharts(state.currentSymbol, state.currentName, state.currentData);
    }
  }
});

els.symbol.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loadChart();
});

els.lookback.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') updateIndicators();
});

// Initialize on page load
window.addEventListener('load', () => {
  initCharts();
  loadChart();
});


</script>
</body>
</html>
